<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1621">
  <meta name="robots" content="noindex">
  <title>Junatma</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="app">
    <header class="top" id="top" hidden>
      <button id="back" class="text-btn" type="button">← Orqaga</button>
      <h1 id="title"></h1>
    </header>
    <main id="screen"></main>

      <p id="modal-body"></p>
      <div class="stack">
        <button id="modal-yes" class="btn primary" type="button"></button>
        <button id="modal-no" class="btn dark" type="button"></button>
      </div>
    </div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
